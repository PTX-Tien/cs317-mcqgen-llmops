version: '3.8'

services:

  # ── Nginx API Gateway (Cân bằng tải cho các API instances) ─────────────────
  nginx:
    image: nginx:1.27-alpine
    container_name: mcqgen-nginx-scalable
    restart: unless-stopped
    ports:
      - "80:80" # Nhận request từ trình duyệt hoặc frontend tại port 80
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/nginx.conf:ro
    depends_on:
      - api
    healthcheck:
      test: ["CMD", "nginx", "-t"]
      interval: 10s
      timeout: 5s
      retries: 3
    networks:
      - mcqgen-scalable-network

  # ── FastAPI — Có thể scale với: --scale api=N ─────────────────────────────
  api:
    image: mcqgen-api:v1.0
    restart: unless-stopped
    expose:
      - "7860" # Chỉ expose nội bộ cho Nginx load-balance
    env_file:
      - .env # Đọc cấu hình tập trung từ file .env
    environment:
      - CHROMA_SERVER_HOST=chromadb
      - VLLM_URL=http://vllm:8000/v1 # Kết nối nội bộ trực tiếp đến vLLM
    depends_on:
      redis:
        condition: service_healthy
      chromadb:
        condition: service_healthy
    command: >
      uvicorn api.main:app
        --host 0.0.0.0
        --port 7860
        --workers 2
        --loop uvloop
        --http httptools
    volumes:
      - app_data:/app/data
      - ./input:/app/input
      - ./output:/app/output
    networks:
      - mcqgen-scalable-network

  # ── Celery High-Priority Worker (Sinh câu hỏi MCQ) ────────────────────────
  worker:
    image: mcqgen-api:v1.0
    restart: unless-stopped
    env_file:
      - .env
    environment:
      - CHROMA_SERVER_HOST=chromadb
      - VLLM_URL=http://vllm:8000/v1
    depends_on:
      redis:
        condition: service_healthy
      chromadb:
        condition: service_healthy
    command: >
      celery -A api.tasks worker
        --loglevel=info
        --concurrency=1
        --queues=mcq.high,celery
        --hostname=worker-high@%h
        --max-tasks-per-child=10
    volumes:
      - app_data:/app/data
      - ./input:/app/input
      - ./output:/app/output
    networks:
      - mcqgen-scalable-network

  # ── Celery Low-Priority Worker (Tác vụ nền, warmup) ───────────────────────
  worker-low:
    image: mcqgen-api:v1.0
    restart: unless-stopped
    env_file:
      - .env
    environment:
      - CHROMA_SERVER_HOST=chromadb
      - VLLM_URL=http://vllm:8000/v1
    depends_on:
      redis:
        condition: service_healthy
      chromadb:
        condition: service_healthy
    command: >
      celery -A api.tasks worker
        --loglevel=info
        --concurrency=2
        --queues=mcq.low
        --hostname=worker-low@%h
        --max-tasks-per-child=20
    volumes:
      - app_data:/app/data
      - ./input:/app/input
      - ./output:/app/output
    networks:
      - mcqgen-scalable-network

  # ── ChromaDB (Vector DB lưu trữ tri thức cho RAG) ──────────────────────────
  chromadb:
    image: chromadb/chroma:latest
    container_name: mcqgen-chromadb-scalable
    restart: unless-stopped
    ports:
      - "8000:8000"
    volumes:
      - ./data/indexes:/chroma/chroma # Mount chia sẻ tài nguyên vector index
    healthcheck:
      test: ["CMD-SHELL", "curl -f http://localhost:8000/api/v1/heartbeat || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 3
    networks:
      - mcqgen-scalable-network

  # ── Langfuse (Giám sát tracing LLMOps pipeline) ─────────────────────────────
  langfuse:
    image: langfuse/langfuse:2
    container_name: mcqgen-langfuse-scalable
    restart: unless-stopped
    ports:
      - "${LANGFUSE_PORT:-8083}:3000"
    environment:
      - NEXTAUTH_URL=http://localhost:3000
      - NEXTAUTH_SECRET=mcqgen-langfuse-scalable-secret-2026
      - SALT=mcqgen-scalable-salt
      - DB_PROVIDER=sqlite
      - DB_SQLITE_PATH=/home/nextuser/langfuse.db
    volumes:
      - langfuse_data:/home/nextuser
    networks:
      - mcqgen-scalable-network

  # ── vLLM Serving Engine (Phục vụ Qwen Model qua GPU) ───────────────────────
  vllm:
    image: vllm/vllm-openai:latest
    container_name: mcqgen-vllm-scalable
    restart: unless-stopped
    ports:
      - "${VLLM_PORT:-7681}:8000"
    volumes:
      - ~/.cache/huggingface:/root/.cache/huggingface # Mount cache tránh tải lại weights
    deploy:
      resources:
        resources:
          reservations:
            devices:
              - driver: nvidia
                count: all
                capabilities: [gpu] # Đăng ký sử dụng GPU của Server Lab
    command: --model Qwen/Qwen2.5-7B-Instruct --port 8000 --max-model-len 5000 --max-num-seqs 4
    networks:
      - mcqgen-scalable-network

  # ── Next.js Frontend Webapp ────────────────────────────────────────────────
  webapp:
    build:
      context: ./webapp
      dockerfile: Dockerfile
    container_name: mcqgen-webapp-scalable
    restart: unless-stopped
    ports:
      - "${WEBAPP_PORT:-8081}:3000"
    environment:
      - NEXT_PUBLIC_API_URL=http://localhost:80 # Trình duyệt client gọi API thông qua cổng 80 của Nginx Gateway
    depends_on:
      - nginx
    networks:
      - mcqgen-scalable-network

  # ── Redis (Phân chia logic 4 DBs) ──────────────────────────────────────────
  redis:
    image: redis:7-alpine
    container_name: mcqgen-redis-scalable
    restart: unless-stopped
    volumes:
      - redis_data:/data
    command: >
      redis-server
        --save 60 1
        --loglevel warning
        --maxmemory 512mb
        --maxmemory-policy allkeys-lru
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 5
    networks:
      - mcqgen-scalable-network

# ── Quản lý lưu trữ tĩnh và mạng nội bộ ──────────────────────────────────────
volumes:
  app_data: # Chia sẻ SQLite db giữa các bản sao của api và worker
  redis_data:
  langfuse_data:

networks:
  mcqgen-scalable-network:
    driver: bridge