stages:
  transcript_chunking:
    cmd: python -m src.mcqgen.chunk_transcripts
    deps:
      - src/mcqgen/chunk_transcripts.py
      - src/mcqgen/common.py
      - input/transcribe_data/
      - input/videos1.txt
    outs:
      - data/processed/transcript_chunks_with_timestamps.jsonl

  indexing:
    cmd: python -m src.mcqgen.indexing
    deps:
      - src/mcqgen/indexing.py
      - src/mcqgen/common.py
      - input/slide/
      - data/processed/transcript_chunks_with_timestamps.jsonl
    outs:
      - data/processed/concept_chunks.jsonl
      - data/indexes/

  benchmark_rag:
    cmd: mkdir -p data/benchmarks && python -m src.mcqgen.advanced_retrieval adaptive > data/benchmarks/rag_benchmark.log 2>&1
    deps:
      - src/mcqgen/advanced_retrieval.py
      - data/indexes/
    outs:
      - data/benchmarks/
