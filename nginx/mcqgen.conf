# nginx/mcqgen.conf
# Áp dụng: sudo ln -sf /path/to/llmops_v2/nginx/mcqgen.conf /etc/nginx/sites-enabled/mcqgen.conf
#           sudo nginx -t && sudo systemctl reload nginx
#
# Routing:
#   /api/ws/*  → FastAPI WebSocket (port 8080)
#   /api/*     → FastAPI REST      (port 8080, strip /api prefix)
#   /          → Next.js           (port 3000 khi production, 8081 khi dev)

upstream mcqgen_api {
    server 127.0.0.1:8080;
    keepalive 32;
}

upstream mcqgen_web {
    # Production (next start): port 3000
    # Dev (next dev):          port 8081
    server 127.0.0.1:3000;
    keepalive 16;
}

server {
    listen 80;
    server_name _;

    client_max_body_size 5m;

    # ── WebSocket — phải trước /api/ để match trước ──────────────────────────
    location /api/ws/ {
        rewrite ^/api(/ws/.*)$ $1 break;
        proxy_pass http://mcqgen_api;
        proxy_http_version 1.1;
        proxy_set_header Upgrade    $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host       $host;
        proxy_set_header X-Real-IP  $remote_addr;
        proxy_read_timeout 3600s;
    }

    # ── FastAPI REST API ──────────────────────────────────────────────────────
    location /api/ {
        rewrite ^/api/(.*)$ /$1 break;
        proxy_pass http://mcqgen_api;
        proxy_http_version 1.1;
        proxy_set_header Connection "";
        proxy_set_header Host             $host;
        proxy_set_header X-Real-IP        $remote_addr;
        proxy_set_header X-Forwarded-For  $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_connect_timeout 10s;
        proxy_read_timeout   600s;   # generation task có thể mất ~10 phút
        proxy_send_timeout    60s;
    }

    # ── Next.js (frontend) ───────────────────────────────────────────────────
    location / {
        proxy_pass http://mcqgen_web;
        proxy_http_version 1.1;
        proxy_set_header Upgrade    $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host       $host;
        proxy_set_header X-Real-IP  $remote_addr;
        proxy_read_timeout 60s;
    }

    # ── Next.js HMR (dev mode) — WebSocket ───────────────────────────────────
    location /_next/webpack-hmr {
        proxy_pass http://mcqgen_web/_next/webpack-hmr;
        proxy_http_version 1.1;
        proxy_set_header Upgrade    $http_upgrade;
        proxy_set_header Connection "upgrade";
    }
}
