services:
  # ── INFRASTRUCTURE: REDIS ──────────────────────────────────────────────────
  redis:
    image: redis:7-alpine
    container_name: mcqgen-redis
    restart: unless-stopped
    ports:
      - "${REDIS_PORT:-6379}:6379"
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 5
    networks:
      - mcqgen-network

  # ── INFRASTRUCTURE: CHROMADB (Móc thẳng sang data/indexes của Thanhld) ─────
  chromadb:
    image: chromadb/chroma:latest
    container_name: mcqgen-chromadb
    restart: unless-stopped
    ports:
      - "${CHROMA_PORT:-8010}:8000"
    volumes:
      - ./data/indexes:/chroma/chroma
    networks:
      - mcqgen-network

  # ── OBSERVABILITY: LANGFUSE ────────────────────────────────────────────────
  langfuse:
    image: langfuse/langfuse:2
    container_name: mcqgen-langfuse
    restart: unless-stopped
    ports:
      - "${LANGFUSE_PORT:-8089}:3000"
    environment:
      - NEXTAUTH_URL=http://localhost:3000
      - NEXTAUTH_SECRET=mcqgen-langfuse-secret-key-2026
      - SALT=mcqgen-salt-value
      - DB_PROVIDER=sqlite
      - DB_SQLITE_PATH=/home/nextuser/langfuse.db
    volumes:
      - langfuse_data:/home/nextuser
    networks:
      - mcqgen-network

  # ── BACKEND: API (FASTAPI) ─────────────────────────────────────────────────
  api:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: mcqgen-api
    restart: unless-stopped
    ports:
      - "${API_PORT:-8080}:7860"
    env_file:
      - .env
    environment:
      - CHROMA_SERVER_HOST=chromadb
      - VLLM_URL=http://vllm:8000/v1
      - PYTHONPATH=/app
    depends_on:
      redis:
        condition: service_healthy
      chromadb:
        condition: service_started
    command: python -m uvicorn api.main:app --host 0.0.0.0 --port 7860
    volumes:
      - ./data:/app/data
      - ./input:/app/input
      - ./output:/app/output
    networks:
      - mcqgen-network

  # ── BACKEND: CELERY WORKER ─────────────────────────────────────────────────
  worker:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: mcqgen-worker
    restart: unless-stopped
    env_file:
      - .env
    environment:
      - CHROMA_SERVER_HOST=chromadb
      - VLLM_URL=http://vllm:8000/v1
      - PYTHONPATH=/app
    depends_on:
      redis:
        condition: service_healthy
      chromadb:
        condition: service_started
    command: python -m celery -A api.tasks worker --loglevel=info --concurrency=1 --queues=mcq.high,celery --hostname=worker-high@%h -Ofair
    volumes:
      - ./data:/app/data
      - ./input:/app/input
      - ./output:/app/output
    networks:
      - mcqgen-network

  # ── FRONTEND: WEBAPP (NEXT.JS) ─────────────────────────────────────────────
  webapp:
    build:
      context: ./webapp
      dockerfile: Dockerfile
      args:
        NEXT_PUBLIC_API_BACKEND: http://api:7860
    container_name: mcqgen-webapp
    restart: unless-stopped
    ports:
      - "${WEBAPP_PORT:-8081}:3000"
    environment:
      - NEXT_PUBLIC_API_URL=http://localhost:${API_PORT:-8080}
      - NEXT_PUBLIC_API_BACKEND=http://api:7860
    depends_on:
      - api
    networks:
      - mcqgen-network

networks:
  mcqgen-network:
    driver: bridge

volumes:
  redis_data:
  langfuse_data:
