# nginx/nginx.conf — Reverse proxy + load balancing cho MCQGen API
#
# Topology:
#   Browser / Client
#       ↓ :80
#   [Nginx] ← rate limiting, timeouts, load balancing
#       ↓
#   [api:7860 × N instances]  (Docker DNS round-robin)
#       ↓
#   [Redis] + [vLLM] + [Celery workers]

worker_processes auto;
error_log /var/log/nginx/error.log warn;
pid       /var/run/nginx.pid;

events {
    worker_connections 1024;
    use epoll;
    multi_accept on;
}

http {
    include       /etc/nginx/mime.types;
    default_type  application/octet-stream;

    # ── Logging ──────────────────────────────────────────────────────────────
    log_format main '$remote_addr - $remote_user [$time_local] '
                    '"$request" $status $body_bytes_sent '
                    '"$http_referer" "$http_user_agent" '
                    'rt=$request_time urt=$upstream_response_time '
                    'corr=$http_x_correlation_id';

    access_log /var/log/nginx/access.log main;

    # ── Performance ──────────────────────────────────────────────────────────
    sendfile        on;
    tcp_nopush      on;
    tcp_nodelay     on;
    keepalive_timeout 65;
    gzip on;
    gzip_types application/json text/plain;

    # ── Rate limiting zones (shared memory — hoạt động across workers) ───────
    # zone "api_limit": 10MB store, 20 req/s per IP → burst 50
    # zone "gen_limit": 2MB store, 1 req/30s per IP (heavy endpoint)
    limit_req_zone $http_authorization zone=api_limit:10m rate=20r/s;
    limit_req_zone $http_authorization zone=gen_limit:2m  rate=2r/m;

    # ── Upstream — Docker DNS round-robin giữa các api replicas ─────────────
    upstream api_backend {
        # Docker Compose: service name "api" resolves to all replicas
        server api:7860;

        # Health check passive — bỏ qua server 30s nếu 3 lần fail liên tiếp
        # (chỉ hỗ trợ nginx-plus; với nginx OSS dùng max_fails/fail_timeout)
        keepalive 32;             # persistent connections tới backend
        keepalive_requests 1000;
        keepalive_timeout  65s;
    }

    # ── Upstream cho Next.js frontend (optional) ─────────────────────────────
    upstream webapp_backend {
        server webapp:3000;
        keepalive 16;
    }

    # ── Main server block ─────────────────────────────────────────────────────
    server {
        listen 80;
        server_name _;

        # Giới hạn request body (tránh abuse với payload lớn)
        client_max_body_size 2m;

        # Timeout settings
        proxy_connect_timeout  10s;
        proxy_send_timeout     60s;
        proxy_read_timeout    600s;   # Generation task có thể mất ~10 phút

        # Headers chuyển tiếp cho FastAPI
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        # ── API routes ────────────────────────────────────────────────────
        location /api/ {
            limit_req zone=api_limit burst=50 nodelay;
            limit_req_status 429;

            # Strip /api prefix trước khi forward
            rewrite ^/api/(.*) /$1 break;
            proxy_pass http://api_backend;

            # HTTP/1.1 cho keepalive
            proxy_http_version 1.1;
            proxy_set_header Connection "";
        }

        # Generation endpoint — rate limit riêng (nặng hơn)
        location /api/generate {
            limit_req zone=gen_limit burst=5 nodelay;
            limit_req_status 429;

            rewrite ^/api/(.*) /$1 break;
            proxy_pass http://api_backend;
            proxy_http_version 1.1;
            proxy_set_header Connection "";
        }

        # WebSocket — không dùng rate limit, cần upgrade headers
        location /api/ws/ {
            rewrite ^/api/(.*) /$1 break;
            proxy_pass http://api_backend;
            proxy_http_version 1.1;
            proxy_set_header Upgrade    $http_upgrade;
            proxy_set_header Connection "upgrade";
            proxy_read_timeout 3600s;   # WebSocket cần timeout dài
        }

        # ── Frontend (Next.js) ────────────────────────────────────────────
        location / {
            proxy_pass http://webapp_backend;
            proxy_http_version 1.1;
            proxy_set_header Upgrade    $http_upgrade;
            proxy_set_header Connection "upgrade";
        }

        # ── Health check endpoint cho load balancer ───────────────────────
        location /nginx-health {
            access_log off;
            return 200 "healthy\n";
            add_header Content-Type text/plain;
        }

        # ── Error responses ───────────────────────────────────────────────
        error_page 429 @rate_limited;
        location @rate_limited {
            default_type application/json;
            return 429 '{"detail":"Rate limit exceeded. Please slow down.","status":429}';
        }

        error_page 502 503 504 @upstream_error;
        location @upstream_error {
            default_type application/json;
            return 502 '{"detail":"API server is temporarily unavailable.","status":502}';
        }
    }
}
