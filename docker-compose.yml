services:
  redis:
    image: redis:7-alpine
    container_name: mcqgen-redis
    restart: unless-stopped
    expose:
      - "6379"
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 5
    networks:
      - mcqgen-network

  chromadb:
    image: chromadb/chroma:latest
    container_name: mcqgen-chromadb
    restart: unless-stopped
    ports:
      - "${CHROMA_PORT:-8000}:8000"
    volumes:
      - ./data/indexes:/chroma/chroma
    networks:
      - mcqgen-network

  vllm:
    image: ${VLLM_IMAGE:-vllm/vllm-openai:v0.5.4}
    container_name: mcqgen-vllm
    restart: unless-stopped
    ipc: host
    ports:
      - "${VLLM_PORT:-7681}:8000"
    volumes:
      - ~/.cache/huggingface:/root/.cache/huggingface
    environment:
      - NVIDIA_VISIBLE_DEVICES=${VLLM_GPU_DEVICES:-all}
      - NVIDIA_DRIVER_CAPABILITIES=compute,utility
      - NCCL_P2P_DISABLE=${NCCL_P2P_DISABLE:-1}
      - NCCL_IB_DISABLE=${NCCL_IB_DISABLE:-1}
      - NCCL_DEBUG=${NCCL_DEBUG:-WARN}
    command: >
      --model ${VLLM_MODEL_ID:-Qwen/Qwen2.5-7B-Instruct}
      --served-model-name ${VLLM_MODEL:-mcqgen}
      --host 0.0.0.0
      --port 8000
      --tensor-parallel-size ${VLLM_TENSOR_PARALLEL_SIZE:-1}
      --disable-custom-all-reduce
      --dtype ${VLLM_DTYPE:-half}
      --max-model-len ${VLLM_MAX_MODEL_LEN:-5000}
      --max-num-seqs ${VLLM_MAX_NUM_SEQS:-4}
    networks:
      - mcqgen-network

  api:
    build:
      context: .
      dockerfile: api/Dockerfile
    image: mcqgen-api:v1.0
    container_name: mcqgen-api
    restart: unless-stopped
    ports:
      - "${API_PORT:-8080}:7860"
    env_file:
      - .env
    environment:
      - REDIS_BASE_URL=redis://redis:6379
      - CELERY_BROKER=redis://redis:6379/0
      - CELERY_BACKEND=redis://redis:6379/1
      - REDIS_CACHE_URL=redis://redis:6379/2
      - REDIS_SESSION_URL=redis://redis:6379/3
      - CHROMA_SERVER_HOST=chromadb
      - VLLM_URL=http://vllm:8000/v1
      - LANGFUSE_BASE_URL=${LANGFUSE_BASE_URL:-http://host.docker.internal:${LANGFUSE_PORT:-8083}}
      - LANGFUSE_HOST=${LANGFUSE_BASE_URL:-http://host.docker.internal:${LANGFUSE_PORT:-8083}}
    extra_hosts:
      - "host.docker.internal:host-gateway"
    depends_on:
      redis:
        condition: service_healthy
      chromadb:
        condition: service_started
    command: uvicorn api.main:app --host 0.0.0.0 --port 7860
    volumes:
      - ./data:/app/data
      - ./input:/app/input
      - ./output:/app/output
    networks:
      - mcqgen-network

  worker:
    build:
      context: .
      dockerfile: api/Dockerfile
    image: mcqgen-api:v1.0
    container_name: mcqgen-worker
    restart: unless-stopped
    env_file:
      - .env
    environment:
      - REDIS_BASE_URL=redis://redis:6379
      - CELERY_BROKER=redis://redis:6379/0
      - CELERY_BACKEND=redis://redis:6379/1
      - REDIS_CACHE_URL=redis://redis:6379/2
      - REDIS_SESSION_URL=redis://redis:6379/3
      - CHROMA_SERVER_HOST=chromadb
      - VLLM_URL=http://vllm:8000/v1
      - LANGFUSE_BASE_URL=${LANGFUSE_BASE_URL:-http://host.docker.internal:${LANGFUSE_PORT:-8083}}
      - LANGFUSE_HOST=${LANGFUSE_BASE_URL:-http://host.docker.internal:${LANGFUSE_PORT:-8083}}
    extra_hosts:
      - "host.docker.internal:host-gateway"
    depends_on:
      redis:
        condition: service_healthy
      chromadb:
        condition: service_started
    command: celery -A api.tasks worker --loglevel=info --concurrency=1 --queues=${CELERY_QUEUE_HIGH:-mcq.mcqgen.high},celery --hostname=worker-high@%h -Ofair
    volumes:
      - ./data:/app/data
      - ./input:/app/input
      - ./output:/app/output
    networks:
      - mcqgen-network

  webapp:
    build:
      context: ./webapp
      dockerfile: Dockerfile
      args:
        NEXT_PUBLIC_API_URL: /api
        NEXT_PUBLIC_API_BACKEND: http://api:7860
    container_name: mcqgen-webapp
    restart: unless-stopped
    ports:
      - "${WEBAPP_PORT:-8081}:3000"
    environment:
      - NEXT_PUBLIC_API_URL=/api
      - NEXT_PUBLIC_API_BACKEND=http://api:7860
    depends_on:
      - api
    networks:
      - mcqgen-network

networks:
  mcqgen-network:
    driver: bridge

volumes:
  redis_data:
