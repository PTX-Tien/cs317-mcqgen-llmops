name: CI

on:
  push:
    branches: [main, dev]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.10"

      - name: Install Python deps
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements_api.txt
          pip install pytest

      - name: Run tests (pytest)
        run: pytest tests -q
        # Test API tự skip nếu thiếu service nền; test pipeline/PDF luôn chạy.

      - name: Validate data pipeline (nếu có dữ liệu)
        run: python scripts/validate_data_pipeline.py --no-report || true

  webapp-build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
      - name: Build Next.js webapp
        working-directory: webapp
        run: |
          npm ci
          npm run build
