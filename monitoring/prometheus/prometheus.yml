global:
  scrape_interval: 15s
  evaluation_interval: 15s

scrape_configs:
  - job_name: "vllm"
    static_configs:
      - targets: ["host.docker.internal:7681"]
    metrics_path: "/metrics"

  - job_name: "fastapi"
    static_configs:
      - targets: ["host.docker.internal:7860"]
    metrics_path: "/metrics"

  - job_name: "celery"
    static_configs:
      - targets: ["host.docker.internal:5555"]
    metrics_path: "/metrics"
