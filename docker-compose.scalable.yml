version: '3.8'

services:

  # ── Nginx API Gateway (Cân bằng tải cho các API instances) ─────────────────
  nginx:
    image: nginx:1.27-alpine
    container_name: mcqgen-nginx-scalable
    restart: unless-stopped
    ports:
      - "80:80" # Nhận request từ trình duyệt hoặc frontend tại port 80
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/nginx.conf:ro
    depends_on:
      - api
    healthcheck:
      test: ["CMD", "nginx", "-t"]
      interval: 10s
      timeout: 5s
      retries: 3
    networks:
      - mcqgen-scalable-network

  # ── FastAPI — Có thể scale với: --scale api=N ─────────────────────────────
  api:
    build:
      context: .
      dockerfile: api/Dockerfile
    image: mcqgen-api:v1.0
    restart: unless-stopped
    expose:
      - "7860" # Chỉ expose nội bộ cho Nginx load-balance
    env_file:
      - .env # Đọc cấu hình tập trung từ file .env
    environment:
      - REDIS_BASE_URL=redis://redis:6379
      - CELERY_BROKER=redis://redis:6379/0
      - CELERY_BACKEND=redis://redis:6379/1
      - REDIS_CACHE_URL=redis://redis:6379/2
      - REDIS_SESSION_URL=redis://redis:6379/3
      - CHROMA_SERVER_HOST=chromadb
      - VLLM_URL=http://vllm:8000/v1 # Kết nối nội bộ trực tiếp đến vLLM
      - LANGFUSE_BASE_URL=${LANGFUSE_BASE_URL:-http://host.docker.internal:${LANGFUSE_PORT:-8083}}
      - LANGFUSE_HOST=${LANGFUSE_BASE_URL:-http://host.docker.internal:${LANGFUSE_PORT:-8083}}
    extra_hosts:
      - "host.docker.internal:host-gateway"
    depends_on:
      redis:
        condition: service_healthy
      chromadb:
        condition: service_healthy
    command: >
      uvicorn api.main:app
        --host 0.0.0.0
        --port 7860
        --workers 2
        --loop uvloop
        --http httptools
    volumes:
      - app_data:/app/data
      - ./input:/app/input
      - ./output:/app/output
    networks:
      - mcqgen-scalable-network

  # ── Celery High-Priority Worker (Sinh câu hỏi MCQ) ────────────────────────
  worker:
    build:
      context: .
      dockerfile: api/Dockerfile
    image: mcqgen-api:v1.0
    restart: unless-stopped
    env_file:
      - .env
    environment:
      - REDIS_BASE_URL=redis://redis:6379
      - CELERY_BROKER=redis://redis:6379/0
      - CELERY_BACKEND=redis://redis:6379/1
      - REDIS_CACHE_URL=redis://redis:6379/2
      - REDIS_SESSION_URL=redis://redis:6379/3
      - CHROMA_SERVER_HOST=chromadb
      - VLLM_URL=http://vllm:8000/v1
      - LANGFUSE_BASE_URL=${LANGFUSE_BASE_URL:-http://host.docker.internal:${LANGFUSE_PORT:-8083}}
      - LANGFUSE_HOST=${LANGFUSE_BASE_URL:-http://host.docker.internal:${LANGFUSE_PORT:-8083}}
    extra_hosts:
      - "host.docker.internal:host-gateway"
    depends_on:
      redis:
        condition: service_healthy
      chromadb:
        condition: service_healthy
    command: >
      celery -A api.tasks worker
        --loglevel=info
        --concurrency=1
        --queues=${CELERY_QUEUE_HIGH:-mcq.mcqgen.high},celery
        --hostname=worker-high@%h
        --max-tasks-per-child=10
    volumes:
      - app_data:/app/data
      - ./input:/app/input
      - ./output:/app/output
    networks:
      - mcqgen-scalable-network

  # ── Celery Low-Priority Worker (Tác vụ nền, warmup) ───────────────────────
  worker-low:
    build:
      context: .
      dockerfile: api/Dockerfile
    image: mcqgen-api:v1.0
    restart: unless-stopped
    env_file:
      - .env
    environment:
      - REDIS_BASE_URL=redis://redis:6379
      - CELERY_BROKER=redis://redis:6379/0
      - CELERY_BACKEND=redis://redis:6379/1
      - REDIS_CACHE_URL=redis://redis:6379/2
      - REDIS_SESSION_URL=redis://redis:6379/3
      - CHROMA_SERVER_HOST=chromadb
      - VLLM_URL=http://vllm:8000/v1
      - LANGFUSE_BASE_URL=${LANGFUSE_BASE_URL:-http://host.docker.internal:${LANGFUSE_PORT:-8083}}
      - LANGFUSE_HOST=${LANGFUSE_BASE_URL:-http://host.docker.internal:${LANGFUSE_PORT:-8083}}
    extra_hosts:
      - "host.docker.internal:host-gateway"
    depends_on:
      redis:
        condition: service_healthy
      chromadb:
        condition: service_healthy
    command: >
      celery -A api.tasks worker
        --loglevel=info
        --concurrency=2
        --queues=${CELERY_QUEUE_LOW:-mcq.mcqgen.low}
        --hostname=worker-low@%h
        --max-tasks-per-child=20
    volumes:
      - app_data:/app/data
      - ./input:/app/input
      - ./output:/app/output
    networks:
      - mcqgen-scalable-network

  # ── ChromaDB (Vector DB lưu trữ tri thức cho RAG) ──────────────────────────
  chromadb:
    image: chromadb/chroma:latest
    container_name: mcqgen-chromadb-scalable
    restart: unless-stopped
    ports:
      - "8000:8000"
    volumes:
      - ./data/indexes:/chroma/chroma # Mount chia sẻ tài nguyên vector index
    healthcheck:
      test: ["CMD-SHELL", "curl -f http://localhost:8000/api/v1/heartbeat || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 3
    networks:
      - mcqgen-scalable-network

  # ── vLLM Serving Engine (Phục vụ Qwen Model qua GPU) ───────────────────────
  vllm:
    image: ${VLLM_IMAGE:-vllm/vllm-openai:v0.5.4}
    container_name: mcqgen-vllm-scalable
    restart: unless-stopped
    ipc: host
    ports:
      - "${VLLM_PORT:-7681}:8000"
    volumes:
      - ~/.cache/huggingface:/root/.cache/huggingface # Mount cache tránh tải lại weights
    environment:
      - NVIDIA_VISIBLE_DEVICES=${VLLM_GPU_DEVICES:-all}
      - NVIDIA_DRIVER_CAPABILITIES=compute,utility
      - NCCL_P2P_DISABLE=${NCCL_P2P_DISABLE:-1}
      - NCCL_IB_DISABLE=${NCCL_IB_DISABLE:-1}
      - NCCL_DEBUG=${NCCL_DEBUG:-WARN}
    command: >
      --model ${VLLM_MODEL_ID:-Qwen/Qwen2.5-7B-Instruct}
      --served-model-name ${VLLM_MODEL:-mcqgen}
      --host 0.0.0.0
      --port 8000
      --tensor-parallel-size ${VLLM_TENSOR_PARALLEL_SIZE:-1}
      --disable-custom-all-reduce
      --dtype ${VLLM_DTYPE:-half}
      --max-model-len ${VLLM_MAX_MODEL_LEN:-5000}
      --max-num-seqs ${VLLM_MAX_NUM_SEQS:-4}
    networks:
      - mcqgen-scalable-network

  # ── Next.js Frontend Webapp ────────────────────────────────────────────────
  webapp:
    build:
      context: ./webapp
      dockerfile: Dockerfile
      args:
        NEXT_PUBLIC_API_URL: /api
        NEXT_PUBLIC_API_BACKEND: http://nginx:80
    container_name: mcqgen-webapp-scalable
    restart: unless-stopped
    ports:
      - "${WEBAPP_PORT:-8081}:3000"
    environment:
      - NEXT_PUBLIC_API_URL=/api
      - NEXT_PUBLIC_API_BACKEND=http://nginx:80
    depends_on:
      - nginx
    networks:
      - mcqgen-scalable-network

  # ── Redis (Phân chia logic 4 DBs) ──────────────────────────────────────────
  redis:
    image: redis:7-alpine
    container_name: mcqgen-redis-scalable
    restart: unless-stopped
    volumes:
      - redis_data:/data
    command: >
      redis-server
        --save 60 1
        --loglevel warning
        --maxmemory 512mb
        --maxmemory-policy allkeys-lru
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 5
    networks:
      - mcqgen-scalable-network

# ── Quản lý lưu trữ tĩnh và mạng nội bộ ──────────────────────────────────────
volumes:
  app_data: # Chia sẻ SQLite db giữa các bản sao của api và worker
  redis_data:

networks:
  mcqgen-scalable-network:
    driver: bridge
